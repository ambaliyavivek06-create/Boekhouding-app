<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euro Superstore · Boekhouding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2EB;
    --surface:#FFFFFF;
    --surface-2:#FBF9F4;
    --ink:#15242A;
    --ink-soft:#5C6C70;
    --ink-faint:#8A989B;
    --line:#E5DFD3;
    --line-strong:#D7CFBF;
    --green:#0F6E5C;
    --green-deep:#0A5346;
    --green-soft:#E2EFEB;
    --in:#1E8E5A;
    --in-soft:#E4F2E9;
    --out:#BE4A2F;
    --out-soft:#F7E7E1;
    --amber:#B7822A;
    --amber-soft:#F4EAD4;
    --shadow:0 1px 2px rgba(21,36,42,.04), 0 8px 24px rgba(21,36,42,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .display{font-family:'Fraunces',Georgia,serif}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .sidebar{
    background:var(--green-deep);
    color:#EAF3F0;
    padding:26px 18px;
    display:flex;flex-direction:column;gap:6px;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;padding:0 6px}
  .brand .mark{
    width:42px;height:42px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(150deg,#1aa583,#0f6e5c);
    display:grid;place-items:center;font-family:'Fraunces';font-weight:700;font-size:22px;color:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .brand h1{font-family:'Fraunces';font-size:19px;font-weight:600;margin:0;line-height:1.1;color:#fff}
  .brand span{font-size:11.5px;color:#9DC4B9;letter-spacing:.04em;text-transform:uppercase}
  .nav-btn{
    display:flex;align-items:center;gap:13px;
    padding:12px 14px;border-radius:11px;border:0;cursor:pointer;
    background:transparent;color:#CFE3DD;font-size:15px;font-weight:500;text-align:left;width:100%;
    font-family:inherit;transition:background .15s,color .15s;
  }
  .nav-btn svg{width:21px;height:21px;flex:0 0 auto;stroke-width:1.9}
  .nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-btn.active{background:#fff;color:var(--green-deep);font-weight:600}
  .nav-btn.active svg{stroke:var(--green-deep)}
  .sidebar-foot{margin-top:auto;font-size:11.5px;color:#7FA79B;padding:0 8px;line-height:1.5}

  .main{padding:34px 40px 80px;max-width:1180px;width:100%}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
  .page-head h2{font-family:'Fraunces';font-weight:600;font-size:30px;margin:0;letter-spacing:-.01em}
  .page-head p{margin:5px 0 0;color:var(--ink-soft);font-size:14.5px}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:4px}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;gap:18px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{padding:20px 20px 18px}
  .kpi .label{font-size:13px;color:var(--ink-soft);font-weight:500;display:flex;align-items:center;gap:7px}
  .kpi .dot{width:9px;height:9px;border-radius:50%}
  .kpi .val{font-size:27px;font-weight:700;margin-top:10px;line-height:1}
  .kpi .sub{font-size:12.5px;color:var(--ink-faint);margin-top:7px}
  .pos{color:var(--in)} .neg{color:var(--out)}

  .two-col{grid-template-columns:1.35fr 1fr;align-items:start}
  .panel{padding:22px 24px}
  .panel h3{font-family:'Fraunces';font-weight:600;font-size:18px;margin:0 0 4px}
  .panel .hint{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px}

  /* BTW return box */
  .btw-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
  .btw-row:last-child{border-bottom:0}
  .btw-row .k{color:var(--ink-soft);font-size:14px}
  .btw-row .v{font-weight:600}
  .btw-total{background:var(--green-soft);margin:14px -24px -22px;padding:16px 24px;border-radius:0 0 var(--radius) var(--radius);display:flex;justify-content:space-between;align-items:center}
  .btw-total .k{font-weight:600;color:var(--green-deep)}
  .btw-total .v{font-size:20px;font-weight:700;color:var(--green-deep)}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse}
  thead th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;text-align:left;padding:0 14px 11px;border-bottom:1px solid var(--line)}
  thead th.r{text-align:right}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle}
  tbody td.r{text-align:right}
  tbody td.num,tbody td.r.num{white-space:nowrap}
  thead th.r{white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .tag.aankoop{background:var(--out-soft);color:var(--out)}
  .tag.kosten{background:var(--amber-soft);color:var(--amber)}
  .tag.verkoop{background:var(--in-soft);color:var(--in)}
  .pay{font-size:11.5px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink-soft)}
  .icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}
  .icon-btn.danger:hover{border-color:var(--out);color:var(--out);background:var(--out-soft)}
  .icon-btn svg{width:16px;height:16px}

  /* ---------- Buttons / inputs ---------- */
  .btn{font-family:inherit;font-size:15px;font-weight:600;border-radius:11px;padding:12px 20px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:.15s}
  .btn svg{width:18px;height:18px}
  .btn.primary{background:var(--green);color:#fff}
  .btn.primary:hover{background:var(--green-deep)}
  .btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.lg{font-size:16px;padding:14px 24px}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    padding:11px 13px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);
  }
  input.num,td .num{font-family:'JetBrains Mono',monospace}
  input:not([type]){width:100%;font-family:inherit;font-size:15px;color:var(--ink);padding:11px 13px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
  .btw-edit input:not([type]){border:0;border-left:1px solid var(--line);border-radius:0;background:transparent}
  input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:90px;font-family:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);cursor:pointer}
  .seg button.on{border-color:var(--green);background:var(--green-soft);color:var(--green-deep)}
  .seg.pay button.on{border-color:var(--ink);background:var(--ink);color:#fff}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  /* ---------- Scan / dropzone ---------- */
  .dropzone{
    border:2px dashed var(--line-strong);border-radius:var(--radius);
    background:var(--surface-2);padding:34px 24px;text-align:center;cursor:pointer;transition:.15s;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--green);background:var(--green-soft)}
  .dropzone .ic{width:54px;height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px;color:var(--green)}
  .dropzone .ic svg{width:26px;height:26px}
  .dropzone strong{font-size:16px;display:block;margin-bottom:3px}
  .dropzone span{font-size:13.5px;color:var(--ink-soft)}
  .filechip{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 13px;font-size:14px;margin-top:14px}
  .filechip .x{cursor:pointer;color:var(--ink-faint);font-weight:700}

  .scanning{display:flex;align-items:center;gap:13px;color:var(--green-deep);font-weight:600;font-size:15px;padding:8px 0}
  .spinner{width:20px;height:20px;border:2.5px solid var(--green-soft);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .banner{border-radius:11px;padding:13px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;line-height:1.45}
  .banner svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}
  .banner.warn{background:var(--out-soft);color:#8f3320;border:1px solid #e6c4b8}
  .banner.ok{background:var(--in-soft);color:#16613c;border:1px solid #bfe0cd}
  .banner.info{background:var(--amber-soft);color:#7a560f;border:1px solid #e7d3a6}

  /* BTW group editor */
  .btw-edit{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px}
  .btw-edit .head,.btw-edit .line{display:grid;grid-template-columns:74px 1fr 1fr;gap:0;align-items:center}
  .btw-edit .head{background:var(--surface-2);border-bottom:1px solid var(--line)}
  .btw-edit .head div{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:9px 13px}
  .btw-edit .line{border-bottom:1px solid var(--line)}
  .btw-edit .line:last-child{border-bottom:0}
  .btw-edit .pct{padding:11px 13px;font-weight:700;font-family:'JetBrains Mono'}
  .btw-edit .pct.p6{color:var(--in)} .btw-edit .pct.p21{color:var(--out)} .btw-edit .pct.p0{color:var(--ink-soft)}
  .btw-edit input{border:0;border-left:1px solid var(--line);border-radius:0;background:transparent}
  .btw-edit input:focus{box-shadow:none;background:var(--green-soft)}
  .total-line{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:16px 18px;background:var(--ink);color:#fff;border-radius:12px}
  .total-line .k{font-size:14px;color:#B9C7CA}
  .total-line .v{font-family:'JetBrains Mono';font-size:24px;font-weight:700}

  .empty{text-align:center;padding:54px 20px;color:var(--ink-faint)}
  .empty .ic{width:58px;height:58px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 16px;color:var(--ink-faint)}
  .empty strong{display:block;color:var(--ink-soft);font-size:16px;margin-bottom:4px;font-weight:600}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .toolbar select{width:auto;min-width:140px}
  .grow{flex:1}

  .hide{display:none!important}
  @media(max-width:920px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;z-index:30;padding:8px;gap:2px;overflow-x:auto}
    .brand,.sidebar-foot{display:none}
    .nav-btn{flex-direction:column;gap:4px;font-size:11px;padding:8px 6px;text-align:center}
    .nav-btn span{white-space:nowrap}
    .main{padding:24px 18px 110px}
    .kpis{grid-template-columns:1fr 1fr}
    .two-col,.two,.three{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">€</div>
      <div><h1>Euro Superstore</h1><span>Boekhouding</span></div>
    </div>
    <button class="nav-btn active" data-view="overzicht">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span>Overzicht</span>
    </button>
    <button class="nav-btn" data-view="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9V7a2 2 0 0 1 2-2h2M17 5h2a2 2 0 0 1 2 2v2M21 15v2a2 2 0 0 1-2 2h-2M7 19H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Nieuwe factuur</span>
    </button>
    <button class="nav-btn" data-view="verkoop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18l-2 9H5L3 6Z"/><path d="M3 6 2.5 3.5H1"/><circle cx="8" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
      <span>Verkoop (Z)</span>
    </button>
    <button class="nav-btn" data-view="boekingen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="1" fill="currentColor" stroke="none"/><circle cx="13" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="10" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
      <span>Alle boekingen</span>
    </button>
    <button class="nav-btn" data-view="importeren">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      <span>Excel importeren</span>
    </button>
    <button class="nav-btn" data-view="instellingen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      <span>Instellingen</span>
    </button>
    <div class="sidebar-foot">Alles wordt op dit toestel bewaard.</div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- hidden file input -->
<input type="file" id="fileInput" class="hide" accept="image/*,application/pdf">
<input type="file" id="zFileInput" class="hide" accept="image/*,application/pdf">
<input type="file" id="impFile" class="hide" accept=".xlsx,.xlsm,.xls">
<input type="file" id="zxlFile" class="hide" accept=".xlsx,.xlsm,.xls">

<script src="vendor/xlsx.min.js"></script>
<script src="import-core.js"></script>
<script>
/* =========================================================
   Euro Superstore – eenvoudig kasboek
   Opslag: lokaal bestand (Electron)  ·  Factuur lezen: Anthropic API
   ========================================================= */

const PAY = ["CASH","BC","TR","CR.NOTE"];
const MONTHS = ["Januari","Februari","Maart","April","Mei","Juni","Juli","Augustus","September","Oktober","November","December"];

let state = {
  view: "overzicht",
  entries: [],
  settings: { apiKey:"" },
  scan: { file:null, busy:false, error:null, dupe:false },
  zscan: { file:null, busy:false, error:null },
  zmode: "excel",
  zxl: { file:null, busy:false, error:null, result:null, jaar:null },
  imp: { file:null, busy:false, error:null, result:null, jaar:null, done:null },
  filterMonth: "all",
  filterType: "all",
};

/* ---------- helpers ---------- */
const euro = n => "€ " + (Number(n)||0).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = iso => { if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function entryExcl(e){ return (e.b6||0)+(e.b21||0)+(e.b0||0)+(e.korting||0); }
function entryBtw(e){ return (e.t6||0)+(e.t21||0); }
function entryTotal(e){ return entryExcl(e)+entryBtw(e); }

/* ---------- storage (Electron IPC) ---------- */
async function loadEntries(){
  try{ state.entries = await window.api.loadData() || []; }
  catch(e){ state.entries = []; }
}
async function saveEntries(){
  try{ await window.api.saveData(state.entries); }
  catch(e){ alert("Opslaan lukte niet."); }
}
async function loadSettings(){
  try{ state.settings = await window.api.loadSettings() || {apiKey:""}; }
  catch(e){ state.settings = {apiKey:""}; }
}
async function saveSettings(){
  try{ await window.api.saveSettings(state.settings); }catch(e){}
}

/* ---------- duplicate check ---------- */
function findDuplicate(datum, totaal, ignoreId){
  return state.entries.find(e =>
    e.id!==ignoreId && e.datum===datum && Math.abs(entryTotal(e)-totaal) < 0.01
  );
}

/* Bij importeren is datum + totaal te grof: een creditnota heeft
   hetzelfde bedrag en dezelfde datum als de factuur die ze terugdraait.
   Daarom vergelijken we ook naam, soort en betaalwijze. En we zoeken
   enkel in wat er voor de import al stond, zodat regels uit hetzelfde
   bestand elkaar niet wegstrepen. */
function findImportDuplicate(pool, e){
  const totaal = entryTotal(e);
  const naam = (e.leverancier||"").trim().toLowerCase();
  return pool.find(x =>
    x.datum === e.datum &&
    x.type === e.type &&
    Math.abs(entryTotal(x) - totaal) < 0.01 &&
    (x.leverancier||"").trim().toLowerCase() === naam &&
    (x.betaalmethode||"") === (e.betaalmethode||"")
  );
}

/* =========================================================
   NAVIGATION
   ========================================================= */
function setView(v){
  state.view = v;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===v));
  render();
  document.getElementById("main").scrollTop = 0;
}
document.querySelectorAll(".nav-btn").forEach(b=> b.addEventListener("click", ()=>setView(b.dataset.view)) );

/* =========================================================
   RENDER ROUTER
   ========================================================= */
function render(){
  const m = document.getElementById("main");
  if(state.view==="overzicht") m.innerHTML = viewOverzicht();
  else if(state.view==="scan") m.innerHTML = viewScan();
  else if(state.view==="verkoop") m.innerHTML = viewVerkoop();
  else if(state.view==="boekingen") m.innerHTML = viewBoekingen();
  else if(state.view==="importeren") m.innerHTML = viewImport();
  else if(state.view==="instellingen") m.innerHTML = viewInstellingen();
  bindView();
}

/* =========================================================
   1. OVERZICHT
   ========================================================= */
function totals(){
  let verkoop=0,aankoop=0,kosten=0,btwVerk=0,btwInkoop=0,exclVerk=0,exclKost=0;
  for(const e of state.entries){
    const t=entryTotal(e), b=entryBtw(e), x=entryExcl(e);
    if(e.type==="verkoop"){ verkoop+=t; btwVerk+=b; exclVerk+=x; }
    else if(e.type==="aankoop"){ aankoop+=t; btwInkoop+=b; exclKost+=x; }
    else if(e.type==="kosten"){ kosten+=t; btwInkoop+=b; exclKost+=x; }
  }
  const winst = exclVerk - exclKost;
  const btwTeBetalen = btwVerk - btwInkoop;
  const onverdeeld = state.entries.filter(e=>e.type==="verkoop" && e.onverdeeld).length;
  return {verkoop,aankoop,kosten,btwVerk,btwInkoop,btwTeBetalen,winst,onverdeeld};
}

function viewImport(){
  const s = state.imp;
  const r = s.result;

  // samenvatting per soort opbouwen
  let rows = "", nieuw = 0, dubbel = 0;
  if(r){
    const groepen = { verkoop:[], aankoop:[], kosten:[] };
    const pool = state.entries;
    for(const e of r.entries){
      if(findImportDuplicate(pool, e)) dubbel++; else nieuw++;
      (groepen[e.type] || (groepen[e.type]=[])).push(e);
    }
    const labels = { verkoop:"Verkoop (Z)", aankoop:"Aankoop goederen", kosten:"Kosten" };

function bindImport(){

  if(jr) jr.oninput = ()=>{ const v=parseInt(jr.value,10); if(v>=2000 && v<=2099) s.jaar=v; };

  const rd = document.getElementById("impRead"); if(rd) rd.onclick = readExcel;
  const go = document.getElementById("impGo"); if(go) go.onclick = applyImport;

function pickExcel(file){
  const n = (file.name||"").toLowerCase();
  if(!(n.endsWith(".xlsx") || n.endsWith(".xlsm") || n.endsWith(".xls"))){
    state.imp.error = "Kies een Excel-bestand (.xlsx). Dit bestand heeft een ander formaat.";
    state.imp.file = null; render(); return;
  }
  const m = n.match(/(20\d\d)/);
  state.imp.file = file;
  state.imp.error = null;
  state.imp.result = null;
  state.imp.done = null;
  state.imp.jaar = m ? parseInt(m[1],10) : new Date().getFullYear();
  render();
}

function readExcel(){
  const s = state.imp;
  if(!s.file) return;
  if(typeof XLSX === "undefined" || !window.BoekImport){
    s.error = "De Excel-lezer kon niet geladen worden. Herstart de app en probeer opnieuw.";
    render(); return;
  }
  s.busy = true; s.error = null; s.done = null; render();

  const fr = new FileReader();
  fr.onload = () => {
    try{
      const data = new Uint8Array(fr.result);
      s.result = window.BoekImport.parseWorkbook(XLSX, data, s.file.name, s.jaar);
      s.busy = false;
      render();
    }catch(err){
      s.busy = false;
      s.result = null;
      s.error = "Het bestand kon niet gelezen worden: " + (err.message||"onbekende fout") + ". Is het zeker een Excel-bestand?";
      render();
    }
  };
  fr.onerror = () => { s.busy=false; s.error="Het bestand kon niet geopend worden."; render(); };
  fr.readAsArrayBuffer(s.file);
}

async function applyImport(){
  const s = state.imp;
  if(!s.result) return;
  let toegevoegd = 0, overgeslagen = 0;
  const pool = state.entries.slice();   // momentopname van voor de import
  for(const e of s.result.entries){
    if(findImportDuplicate(pool, e)){ overgeslagen++; continue; }
    state.entries.push(Object.assign({}, e, { id:uid(), aangemaakt:Date.now() }));
    toegevoegd++;
  }
  await saveEntries();
  s.done = { toegevoegd, overgeslagen };
  s.result = null;
  s.file = null;
  flash(toegevoegd + " boekingen geïmporteerd ✓");
  render();
}

function pickFile(file){
  const name=(file.name||"").toLowerCase();
  const isHeic = file.type==="image/heic" || file.type==="image/heif" || name.endsWith(".heic") || name.endsWith(".heif");
  if(isHeic){
    state.scan.file=null;
    state.scan.error="Dit is een HEIC-foto (iPhone). Die kan niet gelezen worden. Zet de foto eerst om naar JPG — op iPhone: open de foto, deel hem via WhatsApp of e-mail naar jezelf, dan wordt het automatisch JPG. Of stel je iPhone-camera in op 'Meest compatibel' (JPG).";
    render(); return;
  }
  const ok = file.type.startsWith("image/") || file.type==="application/pdf";
  if(!ok){ state.scan.error="Kies een foto (JPG of PNG) of een PDF-bestand."; render(); return; }
  state.scan.file=file; state.scan.error=null; render();
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);
    r.onerror=()=>rej(new Error("Bestand lezen lukte niet."));
    r.readAsDataURL(file);
  });
}

async function analyzeInvoice(){
  const s=state.scan; if(!s.file) return;
  if(!state.settings.apiKey){
    s.error="Stel eerst je API-sleutel in via Instellingen.";
    render(); return;
  }
  s.busy=true; s.error=null; render();
  try{
    const b64 = await fileToBase64(s.file);
    const isPdf = s.file.type==="application/pdf";
    const res = await window.api.scanInvoice({ base64:b64, mediaType:s.file.type, isPdf });
    if(!res.ok) throw new Error(res.error||"Lezen lukte niet.");

    let txt = (res.text||"").trim().replace(/```json/gi,"").replace(/```/g,"").trim();
    const j = JSON.parse(txt);

    const f = defaultForm("aankoop");
    f.datum = j.datum || todayISO();
    f.leverancier = j.leverancier || "";
    f.betaalmethode = PAY.includes(j.betaalmethode) ? j.betaalmethode : "CASH";
    f.b6 = round2(j.groep6_excl); f.t6 = round2(j.groep6_btw);
    f.b21 = round2(j.groep21_excl); f.t21 = round2(j.groep21_btw);
    f.b0 = round2(j.groep0_excl);
    f.korting = j.korting ? round2(j.korting) : "";
    const calc = entryTotalFromForm(f);
    if(j.totaal_incl_btw && Math.abs(calc - j.totaal_incl_btw) > 0.02){
      const diff = round2(j.totaal_incl_btw - (num(f.b6)+num(f.t6)+num(f.b21)+num(f.t21)+num(f.korting)));
      f.b0 = diff;
    }
    window._scanForm = f;
    state.scan.busy=false;
    render();
  }catch(err){
    state.scan.busy=false;
    state.scan.error = (err.message||"Lezen lukte niet.")+" Je kan de gegevens ook zelf invullen.";
    render();
  }
}
function round2(v){ const n=parseFloat(v); return isNaN(n)?"":Math.round(n*100)/100; }

function saveScan(){

  const total = entryTotalFromForm(f);
  if(!f.datum){ alert("Vul een datum in."); return; }
  if(total===0){ alert("Vul minstens één bedrag in."); return; }
  const dupe = findDuplicate(f.datum, total);
  if(dupe && !confirm(`Er bestaat al een boeking op ${fmtDate(dupe.datum)} van ${euro(entryTotal(dupe))}.\n\nToch opslaan?`)) return;

  state.entries.push({
    id:uid(), type:f.type, datum:f.datum, leverancier:f.leverancier.trim(),
    betaalmethode:f.betaalmethode,
    b6:num(f.b6),t6:num(f.t6),b21:num(f.b21),t21:num(f.t21),b0:num(f.b0),korting:num(f.korting),
    bron:"factuur", aangemaakt:Date.now()
  });
  saveEntries();
  window._scanForm = defaultForm(f.type);
  state.scan.file=null;
  flash("Boeking opgeslagen ✓");
  setView("boekingen");
}

  fr.onload=()=>{
    try{
      z.result=window.BoekImport.parseSalesOnly(XLSX, new Uint8Array(fr.result), z.file.name, z.jaar);
      z.busy=false; render();
    }catch(err){
      z.busy=false; z.result=null;
      z.error="Het bestand kon niet gelezen worden: "+(err.message||"onbekende fout")+".";
      render();
    }
  };
  fr.onerror=()=>{ z.busy=false; z.error="Het bestand kon niet geopend worden."; render(); };
  fr.readAsArrayBuffer(z.file);
}

async function applyZExcel(){
  const z=state.zxl;
  if(!z.result) return;
  let toegevoegd=0, overgeslagen=0;
  const pool=state.entries.slice();
  for(const e of z.result.entries){
    if(findImportDuplicate(pool, e)){ overgeslagen++; continue; }
    state.entries.push(Object.assign({}, e, { id:uid(), aangemaakt:Date.now() }));
    toegevoegd++;
  }
  await saveEntries();
  state.zxl={ file:null, busy:false, error:null, result:null, jaar:null };
  flash(toegevoegd+" verkoopdag"+(toegevoegd===1?"":"en")+" toegevoegd ✓");
  setView("overzicht");
}

/* één dag: in plaats van direct opslaan het formulier invullen */
function fillFromZExcel(){
  const z=state.zxl;
  if(!z.result || z.result.entries.length!==1) return;
  const e=z.result.entries[0];
  const f=defaultVerkForm();
  f.datum=e.datum;
  f.betaalmethode=e.betaalmethode||"CASH";
  if(e.onverdeeld){
    f.split=false;
    f.bedrag=round2(entryTotal(e));
  }else{
    f.split=true;
    f.d6=round2(e.b6+e.t6);
    f.d21=round2(e.b21+e.t21);
    f.d0=round2(e.b0);
  }
  window._verkForm=f;
  state.zxl={ file:null, busy:false, error:null, result:null, jaar:null };
  render();
}

function pickZFile(file){
  const name=(file.name||"").toLowerCase();
  if(file.type==="image/heic"||file.type==="image/heif"||name.endsWith(".heic")||name.endsWith(".heif")){
    state.zscan.file=null;
    state.zscan.error="Dit is een HEIC-foto (iPhone). Zet hem eerst om naar JPG — stuur de foto bijvoorbeeld via WhatsApp naar jezelf, dan wordt het automatisch JPG.";
    render(); return;
  }
  if(!(file.type.startsWith("image/")||file.type==="application/pdf")){
    state.zscan.error="Kies een foto (JPG of PNG) of een PDF.";
    render(); return;
  }
  state.zscan.file=file; state.zscan.error=null; render();
}

async function analyzeZReport(){
  const s=state.zscan; if(!s.file) return;
  if(!state.settings.apiKey){
    s.error="Stel eerst je API-sleutel in via Instellingen.";
    render(); return;
  }
  s.busy=true; s.error=null; render();
  try{
    const b64=await fileToBase64(s.file);
    const isPdf=s.file.type==="application/pdf";
    const res=await window.api.scanInvoice({ base64:b64, mediaType:s.file.type, isPdf, mode:"zreport" });
    if(!res.ok) throw new Error(res.error||"Lezen lukte niet.");

    const txt=(res.text||"").trim().replace(/```json/gi,"").replace(/```/g,"").trim();
    const j=JSON.parse(txt);

    const f=defaultVerkForm();
    f.datum=j.datum||todayISO();
    f.split=true;
    f.d6=round2(j.groep1_6pct_incl);
    f.d21=round2(j.groep2_21pct_incl);
    f.d0=round2(j.groep3_0pct_incl);
    // als de groepen niet optellen tot het ticket-totaal, verschil in groep 3
    const som=num(f.d6)+num(f.d21)+num(f.d0);
    if(j.totaal && Math.abs(som-j.totaal)>0.02){
      f.d0=round2(j.totaal-(num(f.d6)+num(f.d21)));
    }
    if(!som && j.totaal){ f.split=false; f.bedrag=round2(j.totaal); }

    window._verkForm=f;
    s.busy=false; s.file=null;
    render();
  }catch(err){
    s.busy=false;
    s.error=(err.message||"Lezen lukte niet.")+" Je kan de bedragen ook zelf invullen.";
    render();
  }
}

/* ----- boekingen view ----- */
function bindBoekingen(){
  const ft=document.getElementById("ftype"); if(ft) ft.onchange=()=>{ state.filterType=ft.value; render(); };
  const fm=document.getElementById("fmonth"); if(fm) fm.onchange=()=>{ state.filterMonth=fm.value; render(); };
  document.querySelectorAll("[data-del]").forEach(b=> b.onclick=()=>{
    const e=state.entries.find(x=>x.id===b.dataset.del);
    if(e && confirm(`Boeking van ${fmtDate(e.datum)} (${euro(entryTotal(e))}) verwijderen?`)){
      state.entries=state.entries.filter(x=>x.id!==b.dataset.del);

  if(ex) ex.onclick=()=>{
    const menu=document.createElement("div");
    menu.style.cssText="position:absolute;top:100%;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-top:8px;min-width:160px;z-index:20;overflow:hidden";

    csvBtn.textContent="📄 CSV (kommagescheiden)";

    csvBtn.onmouseout=()=>csvBtn.style.background="transparent";
    csvBtn.onclick=()=>{ exportCSV(); menu.remove(); };
    
    const xlsxBtn=document.createElement("button");
    xlsxBtn.textContent="📊 Excel (XLSX)";
    xlsxBtn.style.cssText="width:100%;text-align:left;padding:12px 16px;border:0;background:transparent;cursor:pointer;font-size:14px;font-family:inherit;color:var(--ink)";
    xlsxBtn.onmouseover=()=>xlsxBtn.style.background="var(--surface-2)";
    xlsxBtn.onmouseout=()=>xlsxBtn.style.background="transparent";
    xlsxBtn.onclick=()=>{ exportXLSX(); menu.remove(); };

    setTimeout(()=>{

    },0);
  };
}

function exportXLSX(){
  if(!state.entries.length){ alert("Er is nog niets om te exporteren."); return; }
  exportXLSXAsync();
}
async function exportXLSXAsync(){
  try{
    const XLSX=window.XLSX;
    if(!XLSX){ alert("Excel export is niet beschikbaar. Probeer CSV."); return; }
    
    const head=["Datum","Naam","Betaalmethode","Excl 6%","BTW 6%","Excl 21%","BTW 21%","Excl 0%","Korting","BTW totaal","Excl totaal","Totaal incl"];
    
    // Separate verkoop and aankoop
    const verkoop=[...state.entries].filter(e=>e.type==="verkoop").sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
    const aankoop=[...state.entries].filter(e=>e.type!=="verkoop").sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
    
    const wb=XLSX.utils.book_new();
    
    // ===== SHEET 1: VERKOOP =====
    if(verkoop.length){
      const vRows=verkoop.map(e=>[
        e.datum, e.leverancier||"", e.betaalmethode||"",
        e.b6||0, e.t6||0, e.b21||0, e.t21||0, e.b0||0, e.korting||0,
        entryBtw(e), entryExcl(e), entryTotal(e)
      ]);
      
      const totExcl6=vRows.reduce((s,r)=>s+(r[3]||0),0);
      const totBtw6=vRows.reduce((s,r)=>s+(r[4]||0),0);
      const totExcl21=vRows.reduce((s,r)=>s+(r[5]||0),0);
      const totBtw21=vRows.reduce((s,r)=>s+(r[6]||0),0);
      const totExcl0=vRows.reduce((s,r)=>s+(r[7]||0),0);
      const totKort=vRows.reduce((s,r)=>s+(r[8]||0),0);
      const totBtw=vRows.reduce((s,r)=>s+(r[9]||0),0);
      const totExcl=vRows.reduce((s,r)=>s+(r[10]||0),0);
      const totAll=vRows.reduce((s,r)=>s+(r[11]||0),0);
      
      vRows.push(["TOTAAL VERKOOP","","",totExcl6,totBtw6,totExcl21,totBtw21,totExcl0,totKort,totBtw,totExcl,totAll]);
      
      const ws=XLSX.utils.aoa_to_sheet([head,...vRows]);
      ws["!cols"]=[{wch:11},{wch:18},{wch:14},{wch:11},{wch:10},{wch:11},{wch:10},{wch:10},{wch:10},{wch:11},{wch:11},{wch:12}];
      const fmt="#,##0.00;-#,##0.00";
      for(let r=1; r<=vRows.length; r++){
        for(let c=3; c<=11; c++){
          const cell=ws[XLSX.utils.encode_col(c)+XLSX.utils.encode_row(r)];
          if(cell) cell.z=fmt;
        }
      }
      XLSX.utils.book_append_sheet(wb,ws,"Verkoop (Z)");
    }
    
    // ===== SHEET 2: AANKOOP =====
    if(aankoop.length){
      const aRows=aankoop.map(e=>[
        e.datum, e.type, e.leverancier||"", e.betaalmethode||"",
        e.b6||0, e.t6||0, e.b21||0, e.t21||0, e.b0||0, e.korting||0,
        entryBtw(e), entryExcl(e), entryTotal(e)
      ]);
      
      const totExcl6=aRows.reduce((s,r)=>s+(r[4]||0),0);
      const totBtw6=aRows.reduce((s,r)=>s+(r[5]||0),0);
      const totExcl21=aRows.reduce((s,r)=>s+(r[6]||0),0);
      const totBtw21=aRows.reduce((s,r)=>s+(r[7]||0),0);
      const totExcl0=aRows.reduce((s,r)=>s+(r[8]||0),0);
      const totKort=aRows.reduce((s,r)=>s+(r[9]||0),0);
      const totBtw=aRows.reduce((s,r)=>s+(r[10]||0),0);
      const totExcl=aRows.reduce((s,r)=>s+(r[11]||0),0);
      const totAll=aRows.reduce((s,r)=>s+(r[12]||0),0);
      
      aRows.push(["TOTAAL AANKOOP","","","",totExcl6,totBtw6,totExcl21,totBtw21,totExcl0,totKort,totBtw,totExcl,totAll]);
      
      const headA=["Datum","Soort","Naam","Betaalmethode","Excl 6%","BTW 6%","Excl 21%","BTW 21%","Excl 0%","Korting","BTW totaal","Excl totaal","Totaal incl"];
      const ws=XLSX.utils.aoa_to_sheet([headA,...aRows]);
      ws["!cols"]=[{wch:11},{wch:12},{wch:18},{wch:14},{wch:11},{wch:10},{wch:11},{wch:10},{wch:10},{wch:10},{wch:11},{wch:11},{wch:12}];
      const fmt="#,##0.00;-#,##0.00";
      for(let r=1; r<=aRows.length; r++){
        for(let c=4; c<=12; c++){
          const cell=ws[XLSX.utils.encode_col(c)+XLSX.utils.encode_row(r)];
          if(cell) cell.z=fmt;
        }
      }
      XLSX.utils.book_append_sheet(wb,ws,"Aankoop & Kosten");
    }
    
    // Download via Windows-opslagvenster
    const b64 = XLSX.write(wb, { type:"base64", bookType:"xlsx" });
    const ok = await window.api.saveFile({ name:`boekhouding_${todayISO()}.xlsx`, content:b64, base64:true });
    if(ok) flash("Excel-bestand opgeslagen ✓");
  }catch(e){
    alert("Excel export lukte niet: "+e.message+". Probeer CSV in plaats daarvan.");
  }
}

function exportCSV(){
  if(!state.entries.length){ alert("Er is nog niets om te exporteren."); return; }
  const head=["Datum","Soort","Naam","Betaalmethode","Excl 6%","BTW 6%","Excl 21%","BTW 21%","Excl 0%","Korting","BTW totaal","Excl totaal","Totaal incl"];
  const rows=[...state.entries].sort((a,b)=>(a.datum||"").localeCompare(b.datum||"")).map(e=>[
    e.datum, e.type, e.leverancier||"", e.betaalmethode||"",
    e.b6||0, e.t6||0, e.b21||0, e.t21||0, e.b0||0, e.korting||0,
    entryBtw(e), entryExcl(e), entryTotal(e)
  ]);
  const csv=[head,...rows].map(r=>r.map(c=>{
    const s=String(c).replace(/"/g,'""'); return /[",;\n]/.test(s)?`"${s}"`:s;
  }).join(";")).join("\r\n");
  const csvData="\uFEFF"+csv;
  window.api.saveFile({ name:`boekhouding_${todayISO()}.csv`, content:csvData })
    .then(ok=>{ if(ok) flash("CSV opgeslagen ✓"); });
}

/* ----- tiny toast ----- */
function flash(msg){
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:15px;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.25s";
  document.body.appendChild(t);
  requestAnimationFrame(()=>{ t.style.opacity=1; t.style.bottom="38px"; });
  setTimeout(()=>{ t.style.opacity=0; setTimeout(()=>t.remove(),300); }, 2200);
}
